name: tasktracker-de24

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run setup first}
      POSTGRES_USER: ${POSTGRES_USER:?run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup first}
      APP_DB_USER: ${APP_DB_USER:?run setup first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run setup first}
      METRICS_DB_USER: ${METRICS_DB_USER:?run setup first}
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:?run setup first}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [db_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt: ["no-new-privileges:true"]

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?}
      DB_USER: ${APP_DB_USER:?}
      DB_PASSWORD: ${APP_DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?}
      BOOTSTRAP_MEMBER_USERNAME: ${BOOTSTRAP_MEMBER_USERNAME:-nhanvien}
      BOOTSTRAP_MEMBER_PASSWORD: ${BOOTSTRAP_MEMBER_PASSWORD:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes: [app_logs:/srv/logs]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app_net, db_net, ops_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 10s

  nginx:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8080"]
    volumes: [nginx_logs:/var/log/tasktracker]
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge_net, app_net, ops_net]

  pgadmin:
    image: dpage/pgadmin4:9.3
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    volumes: [pgadmin_data:/var/lib/pgadmin]
    ports: ["127.0.0.1:5050:80"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db_net, admin_net]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [ops_net, admin_net]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, loki]
    networks: [ops_net, admin_net]
    security_opt: ["no-new-privileges:true"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      DATA_SOURCE_USER: ${METRICS_DB_USER:?}
      DATA_SOURCE_PASS: ${METRICS_DB_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db_net, ops_net]
    security_opt: ["no-new-privileges:true"]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [ops_net]
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [ops_net]
    security_opt: ["no-new-privileges:true"]
    # Windows Docker Desktop may expose partial kernel metrics; check Targets UP.

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks: [ops_net]
    security_opt: ["no-new-privileges:true"]

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/logs/app:ro
      - nginx_logs:/logs/nginx:ro
    depends_on: [loki]
    networks: [ops_net]
    security_opt: ["no-new-privileges:true"]

networks:
  app_net: { internal: true }
  db_net: { internal: true }
  ops_net: { internal: true }
  admin_net: {}
  edge_net: {}

volumes:
  pg_data: {}
  app_logs: {}
  nginx_logs: {}
  pgadmin_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
