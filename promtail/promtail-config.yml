server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: application
    static_configs:
      - targets: [localhost]
        labels:
          job: tasktracker-app
          __path__: /logs/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
      - labels:
          level:
          event:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: tasktracker-nginx
          __path__: /logs/nginx/*.log
    pipeline_stages:
      - json:
          expressions:
            status: status
      - labels:
          status:
